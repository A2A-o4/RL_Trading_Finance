name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        # The environment tests only need the environment's own dependencies (no PyTorch)
        run: pip install gymnasium numpy pandas matplotlib pytest
      - name: Run tests
        run: pytest -q
